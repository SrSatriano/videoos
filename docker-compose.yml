services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /workspace/backend
    restart: unless-stopped
    environment:
      VIDEO_OS_DATA_DIR: /workspace/data
      VIDEO_OS_IMPORT_ROOTS: /workspace/Planejamento;/workspace/data/incoming;/host/e
      VIDEO_OS_ALLOWED_OUTPUT_ROOTS: /workspace/data;/workspace/Planejamento;/host/e
      VIDEO_OS_ALLOWED_RECIPE_MEDIA_ROOTS: /workspace/data;/workspace/Planejamento;/host/e
      VIDEO_OS_ALLOW_ANY_IMPORT_PATH: ${VIDEO_OS_ALLOW_ANY_IMPORT_PATH:-0}
      VIDEO_OS_HOST_DRIVE_MOUNT: /host
      VIDEO_OS_CORS_ORIGINS: ${VIDEO_OS_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:${VIDEO_OS_API_PORT:-8000}:8000"
    volumes:
      - ./:/workspace
      - E:/:/host/e
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/system/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m app.worker
    working_dir: /workspace/backend
    restart: unless-stopped
    environment:
      VIDEO_OS_DATA_DIR: /workspace/data
      VIDEO_OS_IMPORT_ROOTS: /workspace/Planejamento;/workspace/data/incoming;/host/e
      VIDEO_OS_ALLOWED_OUTPUT_ROOTS: /workspace/data;/workspace/Planejamento;/host/e
      VIDEO_OS_ALLOWED_RECIPE_MEDIA_ROOTS: /workspace/data;/workspace/Planejamento;/host/e
      VIDEO_OS_ALLOW_ANY_IMPORT_PATH: ${VIDEO_OS_ALLOW_ANY_IMPORT_PATH:-0}
      VIDEO_OS_HOST_DRIVE_MOUNT: /host
    volumes:
      - ./:/workspace
      - E:/:/host/e
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    command: npm run dev -- --host 0.0.0.0
    working_dir: /workspace/frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${VIDEO_OS_WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5173').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  frontend_node_modules:
